{% extends 'base.html' %}

{% block title %}Deletar Avião{% endblock %}

{% block content %}
    <h1 class="text-dark fw-bold mb-4">Deletar Avião</h1>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        <p class="form-label">Prefixo: {{ airplane.identifier }}</p>
        <p class="form-label">Capacidade: {{ airplane.capacity }}</p>
        <p>Tem certeza que deseja deletar esse avião?</p>
        <div class="d-flex gap-2">
            <a href="/airplanes/" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Confirmar</button>
        </div>
    </form>
{% endblock %}
