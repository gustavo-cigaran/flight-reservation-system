<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}{% endblock %} | SRV</title>
</head>

<body class="bg-body-secondary text-white">
    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Sistema de Reserva de Voos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav mx-auto gap-2">
                    <a class="nav-link {% if request.path == '/flights/' %}active text-white{% else %} text-white-50 link-light {% endif %}" href="/flights/">Voos</a>
                    <a class="nav-link {% if request.path == '/customers/' %}active{% else %} text-white-50 link-light {% endif %}" href="/customers/">Clientes</a>
                    <a class="nav-link {% if request.path == '/reserve/' %}active{% else %} text-white-50 link-light {% endif %}" href="/reserve/">Reservas</a>
                </div>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    {% if user.is_authenticated %}
                    <span class="text-white d-none d-lg-inline">Olá, {{ user.username }}!</span>
                    <form action="/logout/" method="POST" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-sm btn-danger">Sair</button>
                    </form>
                    {% else %}
                    <a class="btn btn-sm btn-primary" href="/login/">Entrar</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    {% endblock %}
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
