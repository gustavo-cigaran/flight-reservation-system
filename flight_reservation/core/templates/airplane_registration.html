{% extends 'base.html' %}

{% block title %}Cadastrar Avião{% endblock %}

{% block content %}
    <h1 class="text-dark fw-bold mb-4">Cadastrar Avião</h1>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
            <a href="/airplanes/" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
{% endblock %}
