<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar Reserva de Voo</title>
</head>
<body>
    <h1>Deletar Reserva de Voo</h1>

    <form method="POST">
        {% csrf_token %}
        <p>Cliente: {{ reservation.customer.name }}</p>
        <p>Voo: {{ reservation.flight.origin }} -> {{ reservation.flight.destination }}</p>
        <p>Assento: {{ reservation.seat_number }}</p>
        <p>Tem certeza que deseja deletar essa reserva?</p>
        <a href="/flights/">Cancelar</a>
        <button type="submit">Confirmar</button>
    </form>
</body>
</html>
