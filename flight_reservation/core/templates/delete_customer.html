{% extends 'base.html' %}

{% block title %}Deletar Voo{% endblock %}

{% block content %}
    <h1 class="text-dark fw-bold mb-4">Deletar Voo</h1>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        <p class="form-label">Cliente: {{ customer.name }}</p>
        <p class="form-label">Email: {{ customer.email }}</p>
        <p>Tem certeza que deseja deletar esse voo?</p>
        <div class="d-flex gap-2">
            <a href="/flights/" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Confirmar</button>
        </div>
    </form>
{% endblock %}
