<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voos</title>
</head>
<body>
    <h1>Voos</h1>
    <ul>
        {% for flight in flights %}
            <li>
                {{ flight.id }} {{ flight.origin }} -> {{ flight.destination }} | {{ flight.airplane }} | {{ flight.departure_time }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
