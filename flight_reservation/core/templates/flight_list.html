<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voos</title>
</head>
<body>
    <h1>Voos</h1>
    <ul>
        {% for flight in flights %}
            <li>
                {{ flight.id }} {{ flight.origin }} -> {{ flight.destination }} | {{ flight.airplane }} | {{ flight.departure_time }}
            </li>
        {% endfor %}
    </ul>

    {% if user.is_authenticated %}
        <p>Olá, {{ user.username }}</p>

        <form action="/logout/" method="POST">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% endif %}
</body>
</html>
